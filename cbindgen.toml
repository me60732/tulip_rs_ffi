# cbindgen configuration for the tulip_rs_ffi C header.
#
# Regenerate with:
#   cargo run --bin cbindgen -- --config cbindgen.toml --output include/tulip_rs_ffi.h
# (or, if installed: `cbindgen --config cbindgen.toml --output include/tulip_rs_ffi.h`)

language = "C"
include_guard = "TULIP_RS_FFI_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. Run `cbindgen --config cbindgen.toml --output include/tulip_rs_ffi.h` to regenerate. */"
documentation = true
documentation_style = "doxy"
cpp_compat = true
style = "both"

# Pull in the per-indicator INPUTS/OPTIONS #defines generated by build.rs
# (tulip_rs_ffi_counts.h lives alongside this header in include/). This is a
# top-level cbindgen.toml option, not an [export] one, and survives every
# `cbindgen` regeneration instead of being a one-off hand-edit the next run
# would silently drop.
after_includes = "#include \"tulip_rs_ffi_counts.h\"\n#include \"tulip_rs_ffi_state_ids.h\""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
# Only expose the C-ABI surface; Rust-only helper types stay hidden.
include = ["CIndicatorError", "CStringArray", "CDisplayGroup", "CDisplayGroupArray",
           "CIndicatorInfo", "CIndicatorResult", "CBatchResult", "CSimdResult",
           "CBytes", "CStateFormat"]
# NOTE: CIndicatorId is deliberately NOT listed: it now lives behind an
# include! of a build.rs-generated file that cbindgen cannot parse; the
# C-side constants come from the generated tulip_rs_ffi_state_ids.h
# (pulled in via after_includes above).
